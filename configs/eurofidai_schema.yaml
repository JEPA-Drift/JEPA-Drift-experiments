# Schema EUROFIDAI (D4) — correspondance noms de champs
# Modifiable par le chercheur si les noms de colonnes du portail EUROFIDAI diffèrent.
#
# Convention : cle = nom interne (utilise par le chargeur), valeur = nom de colonne
# dans les fichiers CSV exportes depuis le portail EUROFIDAI.

fields:
  id_stable: "eurofidai_code"      # identifiant stable EUROFIDAI (15 chiffres)
  isin: "isin_code"                # code ISIN
  market: "stock_exchange_name"    # place de cotation (Euronext Paris, Xetra, LSE, ...)
  date: "quotation_date"           # date de cotation (AAAA-MM-JJ)
  adjusted_close: "adjusted_close" # cours ajuste reconstruit depuis adjusted_return
  adjustment_factor: "adjust_coef" # coefficient d'ajustement (jours de split uniquement)
  total_return: "adjusted_return"  # rendement ajuste quotidien
  market_cap: "capitalization"     # capitalisation boursiere
  listing_status: ""               # non fourni par le portail (vide = ignore)
  delisting_date: ""               # non fourni (radiations detectees via absence de donnees)
  index_membership: ""             # non fourni

# Filtre de liquidite : un titre est liquide a t ssi :
# - le volume de t est >= min_volume (0 = pas de filtre sur le volume)
# - le titre a echange au moins min_days_traded_21 jours sur les 21 derniers jours
liquidity:
  min_volume: 0
  min_days_traded_21: 1

# Secteurs GICS (optionnel) : mapping marche -> secteur GICS par defaut
# Si EUROFIDAI fournit une classification sectorielle, mapper ici.
# Laisser vide si non disponible.
sectors:
  enabled: false
  mapping: {}
